name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install .

      - name: Compile
        run: python -m compileall -q quotientguard tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Public certification suite
        run: quotientguard certify

      - name: CLI demo
        run: quotientguard demo

      - name: Sampled JSONL check
        run: quotientguard check fixtures/controls/sampled_projected_gap.jsonl

      - name: TRL explanation
        run: quotientguard explain fixtures/paper/a1_equal_length_clipping.json
