name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require tag on main and synchronized public docs
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python tools/check_release_docs.py --tag "$GITHUB_REF_NAME" --notes-out release-notes.generated.md

      - name: Install objective tests and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build ".[objective]"

      - name: Full tests, benchmark and public certification
        run: |
          python -m compileall -q quotientguard tests tools
          python -c "import torch; print(torch.__version__)"
          python -m unittest discover -s tests -v
          python -m quotientguard certify --out certification-result.json
          python -m quotientguard objective-benchmark --out objective-benchmark.json

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          python -m venv /tmp/qg-release-smoke
          /tmp/qg-release-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/qg-release-smoke/bin/quotientguard --version
          /tmp/qg-release-smoke/bin/quotientguard demo
          /tmp/qg-release-smoke/bin/quotientguard certify

      - name: Package optional agent-neutral workflow wrapper
        shell: bash
        run: |
          cd integrations/skill
          zip -r ../../skill.zip quotientguard

      - name: Generate release checksums
        shell: bash
        run: |
          sha256sum dist/* certification-result.json objective-benchmark.json skill.zip \
            paper/Sim_2026_Estimator_Homomorphism_Compatibility_RLVR_Preprint.pdf \
            LICENSE | sed -e 's#  dist/#  #' -e 's#  paper/#  #' > SHA256SUMS

      - name: Publish immutable GitHub release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* SHA256SUMS certification-result.json objective-benchmark.json \
            skill.zip paper/Sim_2026_Estimator_Homomorphism_Compatibility_RLVR_Preprint.pdf \
            LICENSE \
            --title "QuotientGuard $GITHUB_REF_NAME" \
            --notes-file release-notes.generated.md
